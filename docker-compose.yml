# Dota Themer - Docker Compose Configuration
# For local development and testing

version: '3.8'

services:
  dota-themer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dota-themer
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      # Storage (#52): SQLite is the only backend; dota.db lives in the
      # writable dota_data volume, auto-populated from the JSON files.
      # S3 snapshots (optional): pull at startup, push after every save
      - DOTA_THEMER_S3_BUCKET=${DOTA_THEMER_S3_BUCKET:-}
      - DOTA_THEMER_S3_PREFIX=${DOTA_THEMER_S3_PREFIX:-}
      # AWS credentials pass through for the S3 snapshot client (IaC:
      # everything is env-configurable; unset means boto3 falls back to
      # its default chain - IAM role, ~/.aws, etc.)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_FILE=/app/logs/dota-themer.log
      - ENV=production
      # Lane duo pair stats (optional): daily publicMatches refresh
      - DOTA_THEMER_COMBO_MIN_RANK=${DOTA_THEMER_COMBO_MIN_RANK:-50}
      - DOTA_THEMER_COMBO_PAGES=${DOTA_THEMER_COMBO_PAGES:-120}
      - DOTA_THEMER_COMBO_DELAY_SECONDS=${DOTA_THEMER_COMBO_DELAY_SECONDS:-2.0}
    volumes:
      # Persist logs
      - ./logs:/app/logs
      # Persist data (writable: the SQLite database lives here, #52)
      - dota_data:/app/data
    networks:
      - dota-network

  # Optional: Test service for running core.py CLI
  dota-themer-cli:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dota-themer-cli
    command: ["/app/.venv/bin/python", "core.py", "2"]
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      - ENV=development
    volumes:
      - ./data:/app/data:ro
    networks:
      - dota-network

networks:
  dota-network:
    driver: bridge

volumes:
  dota_data:
