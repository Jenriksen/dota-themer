name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy

      - name: Run Flake8 (PEP8 compliance)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Black (code formatting)
        run: black --check . --verbose

      - name: Run isort (import sorting)
        run: isort --check . --verbose

      - name: Run mypy (type checking)
        run: mypy . --ignore-missing-imports --verbose

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run all unit tests
        run: |
          python -m unittest discover -v

      - name: Run tests with coverage
        run: |
          pip install coverage
          coverage run -m unittest discover
          coverage report --show-missing
          coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install security tools
        run: |
          pip install bandit safety pip-audit

      - name: Run Bandit (security linter)
        run: bandit -r . -f json -o bandit-results.json || true

      - name: Run Safety (dependency vulnerabilities)
        run: safety check --json --output json || true

      - name: Run pip-audit (package vulnerabilities)
        run: pip-audit --format json --output pip-audit-results.json || true

      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: |
            bandit-results.json
            pip-audit-results.json

  build:
    name: Build and Verify
    runs-on: ubuntu-latest
    needs: [lint, test, security-scan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify core functionality
        run: |
          python core.py 1
          python core.py 2
          python core.py 3
          python core.py 4
          python core.py 5

      - name: Verify bot can be imported
        run: python -c "import bot; print('Bot module imports successfully')"

  # Optional: Docker build (if Dockerfile exists)
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: false  # Disabled until Dockerfile is added
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t dota-themer .

      - name: Run container tests
        run: docker run dota-themer python -m unittest discover
