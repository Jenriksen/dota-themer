name: Lint and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy

      - name: Run Flake8 (PEP8 compliance)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Check all files
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Black (code formatting check)
        run: black --check . --verbose

      - name: Run isort (import sorting check)
        run: isort --check . --verbose --diff

      - name: Run mypy (type checking)
        run: mypy . --ignore-missing-imports --verbose

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run all unit tests
        run: python -m unittest discover -v

      - name: Run tests with coverage
        run: |
          pip install coverage
          coverage run -m unittest discover
          coverage report --show-missing --fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            .coverage
            coverage.xml

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install code quality tools
        run: pip install radon pydocstyle

      - name: Run Radon (code complexity)
        run: |
          radon cc . -j --min C --max F
          radon mi . -j --min A --max D

      - name: Run pydocstyle (docstring style)
        run: pydocstyle . || true

  verify:
    name: Functionality Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test core functionality with all party sizes
        run: |
          python core.py 1
          python core.py 2
          python core.py 3
          python core.py 4
          python core.py 5

      - name: Test bot module imports
        run: python -c "import bot; print('Bot module OK')"

      - name: Test core module imports
        run: python -c "import core; print('Core module OK')"

      - name: Test logging module imports
        run: python -c "import logging_config; print('Logging module OK')"
